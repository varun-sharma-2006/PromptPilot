# Runs on every push: offline tests and the secret scan. No API key is used or needed.
name: offline-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest
      - name: Secret scan
        run: python code/check_secrets.py
      - name: Offline tests
        run: python -m pytest tests -q
